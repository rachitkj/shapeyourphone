name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t tests -v
      - name: Validate shipped configs
        shell: bash
        run: for f in config/default.json config/examples/*.json; do python -m shape launcher validate "$f"; done
      - name: Install like a user would (pipx) and smoke-test
        # the runner's shared pipx venv needs Python 3.10+; 3.9 still runs the full test suite above
        if: matrix.python != '3.9'
        shell: bash
        run: |
          python -m pip install --quiet pipx
          python -m pipx install .
          shape --version
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | shape-mcp | grep -q shapeyourphone

  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launcher-debug
          path: |
            launcher/app/build/outputs/apk/debug/*.apk
            launcher/app/build/reports/
          if-no-files-found: warn

  # The real thing: the CLI over real adb against emulators from Android 8 (minSdk) to 16.
  emulator:
    name: emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    needs: [launcher]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34, 36]
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (the emulator needs ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: cd launcher && ./gradlew --no-daemon assembleDebug
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tests/e2e_emulator.py launcher/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots-api${{ matrix.api }}
          path: e2e-artifacts/
          if-no-files-found: warn
