name: Idea or feature request
description: Something you'd like your phone (or the agent) to be able to do.
labels: ["idea"]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to tell your phone?
      description: Phrase it the way you'd ask the agent, e.g. "make my phone boring after 10pm".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today instead?
  - type: textarea
    id: notes
    attributes:
      label: Anything else (other apps that do this well, constraints)
