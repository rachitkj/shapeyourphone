[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeyourphone"
dynamic = ["version"]
description = "Shape your Android phone with an AI agent: reversible debloat, privacy audit, and a home screen that rebuilds itself from your preferences. No root."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rachit Jain"}]
keywords = ["android", "adb", "debloat", "launcher", "ai-agent", "mcp", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/rachitkj/shapeyourphone"
Issues = "https://github.com/rachitkj/shapeyourphone/issues"

[project.scripts]
shape = "shape.cli:run"
shape-mcp = "shape.mcp:main"

[tool.setuptools]
packages = ["shape"]

[tool.setuptools.dynamic]
version = {attr = "shape.__version__"}

[tool.setuptools.package-data]
shape = ["data/*.json", "data/*.md", "data/bloat/*.json", "data/bloat/*.md"]
